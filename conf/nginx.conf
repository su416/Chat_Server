# Nginx TCP 四层负载均衡 — ChatServer
# 客户端连接 127.0.0.1:6000 → Nginx 自动分发到后台 ChatServer 实例
#
# 启动方式：
#   sudo nginx -c /home/ys/Desktop/chat-server/conf/nginx.conf
#   # 或直接替换系统配置：sudo cp conf/nginx.conf /etc/nginx/nginx.conf && sudo nginx -s reload

worker_processes auto;

events {
    worker_connections 10240;
    use epoll;
}

stream {
    # 上游 ChatServer 集群
    upstream chatserver_backend {
        # 最少连接数算法（适合长连接聊天场景）
        least_conn;

        # ChatServer 实例列表
        server 127.0.0.1:6001 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6002 weight=1 max_fails=3 fail_timeout=30s;

        # 扩展：docker compose 跑多个实例
        # server chatserver1:6000 weight=1;
        # server chatserver2:6000 weight=1;
    }

    # 对外监听端口
    server {
        listen 6000;
        proxy_pass chatserver_backend;

        # 连接超时
        proxy_connect_timeout 3s;
        proxy_timeout 600s;  # 聊天是长连接
    }
}
